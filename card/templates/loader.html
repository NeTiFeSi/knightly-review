<script>
/* Knightly Review config — keep front and back in sync.
   acceptNags: NAGs counted as correct (1 !, 2 ?, 3 !!, 4 ??, 5 !?, 6 ?!)
   intro: 'lastMove' (animate the opponent's last move) | 'fullGame' (replay the game, introMoveDelay ms per move)
   afterAnswer: 'flip' (show the back) | 'stay' (stay on the front) | 'grade' (show the back, then answer
     automatically with gradeSolved / gradeHinted / gradeFailed: 1 Again, 2 Hard, 3 Good, 4 Easy)
   hints: show the Hint button */
window.KR_CONFIG = {
  acceptNags: [1, 3, 5],
  autoReplyDelay: 400,
  showEval: true,
  evalOnPuzzleFront: false,
  intro: 'lastMove',
  introMoveDelay: 900,
  afterAnswer: 'flip',
  flipDelay: 1200,
  gradeDelay: 2500,
  gradeSolved: 3,
  gradeHinted: 2,
  gradeFailed: 1,
  hints: true
};
(function () {
  if (window.KnightlyReview) { window.KnightlyReview.mount(); return; }
  if (document.getElementById('kr-script')) return; /* still loading; onload mounts the current card */
  var s = document.createElement('script');
  s.id = 'kr-script';
  s.src = '_knightly.js';
  s.onload = function () { window.KnightlyReview.mount(); };
  s.onerror = function () {
    var r = document.getElementById('kr-root');
    if (r) r.innerHTML = '<div class="kr-error">Knightly Review: _knightly.js is missing from the collection media.</div>';
  };
  document.head.appendChild(s);
})();
</script>
